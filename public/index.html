<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CinéNote</title>
    <meta name="description" content="Notez chaque film, chaque série et chaque épisode, comparez les notes IMDb, Rotten Tomatoes, Metacritic, TMDB et TVmaze, et recevez des suggestions selon vos goûts." />
    <meta name="theme-color" content="#0e0f12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png" />
    <!-- iPhone / iPad : installation sur l'écran d'accueil -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CinéNote" />
    <link rel="stylesheet" href="/styles.css" />
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <a class="skip" href="#view">Aller au contenu</a>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/" aria-label="Accueil">
          <img src="/icons/icon.svg" alt="" width="28" height="28" />
          <span class="brand-name">CinéNote</span>
        </a>
        <nav class="nav-desktop" aria-label="Navigation principale">
          <a href="/" data-nav="home">Accueil</a>
          <a href="/films" data-nav="films">Films</a>
          <a href="/series" data-nav="series">Séries</a>
          <a href="/pour-vous" data-nav="foryou">Pour vous</a>
        </nav>
        <form class="search-form" role="search" data-form="search">
          <label class="visually-hidden" for="q">Rechercher</label>
          <input id="q" name="q" type="search" placeholder="Film, série…" autocomplete="off" enterkeyhint="search" />
        </form>
        <a class="icon-btn search-mobile" href="/recherche" aria-label="Rechercher">
          <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </a>
        <div class="account" id="account"></div>
      </div>
    </header>

    <main id="view" class="container" tabindex="-1">
      <div class="boot">Chargement…</div>
    </main>

    <footer class="footer">
      <div class="container footer-inner">
        <span>© <span id="year"></span> CinéNote</span>
        <a href="/a-propos">À propos, sources &amp; confidentialité</a>
        <a href="/premium">Premium</a>
      </div>
    </footer>

    <nav class="tabbar" aria-label="Navigation">
      <a href="/" data-nav="home">
        <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>Accueil</span>
      </a>
      <a href="/films" data-nav="films">
        <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4M3 12h4M3 16h4M17 8h4M17 12h4M17 16h4"/></svg>
        <span>Films</span>
      </a>
      <a href="/series" data-nav="series">
        <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="m8 2 4 4 4-4"/></svg>
        <span>Séries</span>
      </a>
      <a href="/pour-vous" data-nav="foryou">
        <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
        <span>Pour vous</span>
      </a>
      <a href="/profil" data-nav="profile">
        <svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span>Profil</span>
      </a>
    </nav>
  </body>
</html>
